name: CI

# Runs the REAL production build (tsc -b && vite build) + tests on every push
# and PR to main. This is the guard that was missing when a tsc -b error
# silently froze production for days: `tsc --noEmit` did not catch it, but the
# build command does. A red check here now blocks the merge instead.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solarflow-dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Cache the pnpm store explicitly rather than via setup-node's `cache: pnpm`.
      # solarflow-dashboard/.npmrc sets store-dir=/tmp/.pnpm-store, but setup-node
      # resolves the store from the repo ROOT, where that .npmrc does not apply
      # (working-directory only affects `run:` steps). It therefore computed a
      # default path that never got created, and failed the whole job at post-job
      # cleanup with "Path Validation Error: Path(s) specified in the action for
      # caching do(es) not exist". That was invisible until 2026-08-03 because the
      # Test step always failed first, which made the post step skip.
      - uses: actions/cache@v4
        with:
          path: /tmp/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('solarflow-dashboard/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      # The repo-root package.json holds the deps for the serverless `api/` tree
      # (web-push, @vercel/node, docx). apiResilience.test.ts imports
      # api/trello-card.ts, which lazily imports web-push, so a dashboard-only
      # install fails to resolve it and the Test step dies. vercel.json's
      # installCommand already does both; CI never mirrored it, which is why
      # every run since at least 2026-08-23 has been red.
      - name: Install root deps (serverless api/ tree)
        working-directory: .
        run: npm install

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Build (tsc -b && vite build)
        run: pnpm run build

      - name: Test
        run: pnpm test

  # ── Deploy gate ────────────────────────────────────────────────────────────
  # Until 2026-08-23 the Vercel Git integration deployed on every push to main
  # IN PARALLEL with this workflow, so a red build-and-test stopped nothing: CI
  # was a notification, not a gate. Deploying from here instead, with
  # `needs: build-and-test`, means production is only ever reached by a commit
  # whose real build (tsc -b && vite build) and full test suite went green.
  #
  # Requires the Vercel Git integration to be TURNED OFF for this project,
  # otherwise both paths deploy and the race is back.
  deploy:
    needs: build-and-test
    # Pushes to main only. PR runs must gate without shipping.
    # The VERCEL_TOKEN clause makes this job SELF-ACTIVATING: it skips silently
    # until the secret exists, so committing it does not turn every push red
    # while the secrets are still being set up. Once the token is added it takes
    # over, and the Vercel Git integration should be switched off at that point
    # so the two paths do not both deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # NOTE: deliberately NOT inheriting the top-level solarflow-dashboard
    # working-directory. `vercel --prod` resolves vercel.json from its CWD, and
    # running it from inside solarflow-dashboard once deployed a build with ZERO
    # serverless functions, 404ing every /api/* route for ~21h on 2026-08-12.
    # This job must stay at the repo root.
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to production
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Self-activating: skip cleanly until the token is configured, so this
          # job does not turn every push red during setup. The `secrets` context
          # is NOT available in a job-level `if`, which is why this guard lives
          # in the step rather than up there.
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN not set. Skipping deploy; the Vercel Git integration is still the deploy path."
            echo "SKIPPED=1" >> "$GITHUB_ENV"
            exit 0
          fi
          vercel --prod --yes --token="$VERCEL_TOKEN"

      - name: Verify the live build is actually this commit
        if: env.SKIPPED != '1'
        run: |
          # A push is not a deploy. Poll version.json until the live sha matches
          # the commit that just passed CI, then prove the serverless functions
          # actually built - a version.json match alone does not (2026-08-12).
          TARGET="$(git rev-parse --short HEAD)"
          BASE="https://solarflow-dashboard-sooty.vercel.app"
          echo "Waiting for $TARGET to go live ..."
          for i in $(seq 1 30); do
            LIVE="$(curl -fsS "$BASE/version.json?_=$(date +%s)" | sed -n 's/.*"sha":"\([^"]*\)".*/\1/p')"
            if [ "$LIVE" = "$TARGET" ]; then
              echo "live: $TARGET"
              # /api/users must answer 401, not a Vercel NOT_FOUND page.
              CODE="$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/users")"
              echo "/api/users -> $CODE"
              [ "$CODE" = "401" ] || { echo "::error::serverless functions missing (expected 401, got $CODE)"; exit 1; }
              exit 0
            fi
            echo "  [$i] live=$LIVE, retrying"
            sleep 10
          done
          echo "::error::$TARGET never went live after 5 minutes"
          exit 1
